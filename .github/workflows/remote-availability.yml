name: Keep remote available

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/remote-availability.yml']

# Calls only the public, read-only health endpoint. No credentials or checkout.
permissions: {}

concurrency:
  group: remote-availability
  cancel-in-progress: false

jobs:
  database-health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check the live remote database
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 10 --max-time 20 \
            "https://promptly-teleprompter.vercel.app/api/remote-health?check=$(date +%s)")"
          printf '%s\n' "$response" | jq -e '.ok == true'
